name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *"   # refresh once a day
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/readme-stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Junaid2102&show_icons=true&hide_border=true&theme=transparent&title_color=714B67&icon_color=714B67
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true   # never overwrite a good card with an error card

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Junaid2102&layout=compact&langs_count=8&hide_border=true&theme=transparent&title_color=714B67
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push